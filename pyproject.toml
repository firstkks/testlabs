[project]
name = "quadbook"
version = "0.1.0"
description = "《MuJoCo로 알아보는 Bio-inspired Robotics: 사족보행편》 실습 코드"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mujoco==3.12.0",
    "numpy>=2.1",
    "matplotlib>=3.9",
    "gymnasium>=1.3",
]

[project.optional-dependencies]
# Part 4 (10~12장): 강화학습
rl = [
    "stable-baselines3>=2.9",
    "torch>=2.8",
    "tensorboard>=2.17",
]
# 13장: MJX 대규모 병렬화
mjx = [
    "mujoco-mjx==3.12.0",
    "jax>=0.11",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quadbook"]

[tool.ruff]
line-length = 100
target-version = "py312"
